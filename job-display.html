<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Tracker</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
</head>
<body>
    <main>
        <nav>
            <button id="burger-button">☰</button>
            <h1 class="heading-fancy"><a href="index.html">Job Tracker</a></h1>
            <button id="add-button">+</button>
        </nav>
        <section id="recent-applications">
            <h3 style="margin-bottom: 10px;">Recent Applications</h3>
        </section>
    </main>
    <div id="new-job">
        <h2 class="heading-fancy">Update application</h2>
        <form>
            <label for="job-title">Enter Job Title</label>
            <input type="text" id="job-title" placeholder="Job Title" required autocomplete="off">
            <label for="job-title">Enter Company Name</label>
            <input type="text" id="company-name" placeholder="Enter Company Name" required autocomplete="off">
            <label for="job-title">Enter Job Status</label>
            <input type="text" id="status" placeholder="Applied, Interviewing, Offer or Rejected" required autocomplete="off">
            <label for="job-title">Enter Job Location</label>
            <input type="text" id="location" placeholder="Job Location" required autocomplete="off">
            <button type="submit" id="submit-button">Submit</button>
            <button type="button" id="cancel-button">Cancel</button>
            <button type="submit" id="delete-button">DELETE</button>
        </form>
    </div>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="scripts/full-job-collection.js"></script>
</body>
</html>

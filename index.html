<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Tracker</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
</head>
<body>
    <nav>
        <button id="burger-button">☰</button>
        <h1 class="heading-fancy">Job Tracker</h1>
        <button id="add-button">+</button>
    </nav>
    <h2 class="heading heading-fancy">Dashboard</h2>
    <section id="dashboard">
        <div class="heading-fancy div-styles">
            <i id="application" class="bi bi-file-text dashboard-icons"></i>
            <h3>Applications</h3>
            <h2 id="applied-stat">0</h2>
            <h4>Total Applied</h4>
        </div>
        <div class="heading-fancy div-styles">
            <i id="interview" class="bi bi-person dashboard-icons"></i>
            <h3>Interviewing</h3>
            <h2 id="interview-stat">0</h2>
            <h4>In Progress</h4>
        </div>
        <div class="heading-fancy div-styles">
            <i id="offers" class="bi bi-file-text dashboard-icons"></i>
            <h3>Offers</h3>
            <h2 id="offer-stat">0</h2>
            <h4>Offers Recieved</h4>
        </div>
        <div class="heading-fancy div-styles">
            <i id="rejected" class="bi bi-x-circle dashboard-icons"></i>
            <h3>Rejected</h3>
            <h2 id="rejected-stat">0</h2>
            <h4>Not Sucessful</h4>
        </div>
    </section>
    <div id="pie-chart-div" class="div-styles">
        <canvas id="pie-chart"></canvas>
        <h2 id="total-display"></h2>
    </div>
    <section id="recent-applications">
        <div id="application-section-heading">
            <h3>Recent Applications</h3>
            <button id="view-all"><a href="job-display.html">View All</a></button>
        </div>
    </section>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="main.js"></script>
</body>
</html>
